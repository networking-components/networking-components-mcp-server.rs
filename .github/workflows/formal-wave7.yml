name: Formal Wave 7
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exhaust network MCP authority
        run: |
          python3 - <<'PY'
          from itertools import product
          for auth, network_scope, mutate, admin, tool in product((False,True),(False,True),(False,True),(False,True),('read','mutate','admin')):
              allowed=auth and network_scope
              if tool=='mutate': allowed=allowed and mutate
              if tool=='admin': allowed=allowed and admin
              if not auth or not network_scope: assert not allowed
              if tool=='mutate' and allowed: assert mutate
              if tool=='admin' and allowed: assert admin
          print('Networking Components MCP authority model: ok')
          PY
